<!doctype html>
<html lang="en">

    <title>Login</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar wrap">
        <a class="brand" href="./index.html"><span class="brand__mark">MMP</span><span>Multiplayer Mini Games</span></a>

          <p class="eyebrow">Welcome back</p>

      <footer class="footer"><p>Lab 1 login page</p><p class="muted">Static layout only.</p></footer>
