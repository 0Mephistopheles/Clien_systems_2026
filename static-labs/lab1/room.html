<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Room</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar wrap">
        <a class="brand" href="./index.html"><span class="brand__mark">MMP</span><span>Multiplayer Mini Games</span></a>
        <nav class="nav"><a href="./index.html">Home</a><a href="./games.html">Games</a><a href="./room.html">Room</a><a href="./contact.html">Contact</a></nav>
      </header>
      <main class="main">
        <section class="grid--2">
          <article class="room-card">
            <p class="eyebrow">Room lobby</p>
            <h1>North America Clash</h1>
            <p class="muted">Room code AX92QZ. This layout represents the live gameplay screen.</p>
            <div class="board" aria-label="Tic Tac Toe board">
              <div class="cell">X</div>
              <div class="cell">O</div>
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell">X</div>
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell"></div>
              <div class="cell">O</div>
            </div>
          </article>
          <article class="room-card">
            <h2>Chat and presence</h2>
            <div class="placeholder">Realtime chat stream</div>
            <div class="placeholder">Online users list</div>
          </article>
        </section>
      </main>
      <footer class="footer"><p>Lab 1 room page</p><p class="muted">Static layout only.</p></footer>
    </div>
  </body>
</html>
