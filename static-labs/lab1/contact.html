<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar wrap">
        <a class="brand" href="./index.html"><span class="brand__mark">MMP</span><span>Multiplayer Mini Games</span></a>
        <nav class="nav"><a href="./index.html">Home</a><a href="./games.html">Games</a><a href="./about.html">About</a><a href="./contact.html">Contact</a><a href="./leaderboards.html">Leaderboards</a></nav>
      </header>
      <main class="main">
        <section class="grid--2">
          <article class="contact-card">
            <h1>Contact the team</h1>
            <form class="list">
              <label><span>Name</span><input type="text" /></label>
              <label><span>Email</span><input type="email" /></label>
              <label><span>Message</span><textarea rows="6"></textarea></label>
              <button class="btn btn--primary" type="button">Send message</button>
            </form>
          </article>
          <article class="contact-card">
            <h2>Support</h2>
            <p class="muted">Email, moderation, and deployment contact details can live here.</p>
          </article>
        </section>
      </main>
      <footer class="footer"><p>Lab 1 contact page</p><p class="muted">Static layout only.</p></footer>
    </div>
  </body>
</html>
